name: Visual Studio Check

on:
  push:
    branches: [realms-visual-studio]
    paths:
      - "visual-studio/**"
      - ".github/workflows/visual-studio-check.yml"
  pull_request:
    paths:
      - "visual-studio/**"
      - ".github/workflows/visual-studio-check.yml"

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check visual-studio/app.js
      - name: Required files
        run: |
          test -f visual-studio/index.html
          test -f visual-studio/styles.css
          test -f visual-studio/app.js
          test -f visual-studio/README.md
      - name: Serve static Studio
        run: |
          python3 -m http.server 8000 --directory visual-studio >/tmp/realms-studio.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8000/ >/tmp/index.html
          curl -fsS http://127.0.0.1:8000/styles.css >/tmp/styles.css
          curl -fsS http://127.0.0.1:8000/app.js >/tmp/app.js
          grep -q "REALMS Visual Production Studio" /tmp/index.html
          grep -q "GEO-001" /tmp/app.js
          grep -q "MON-001" /tmp/app.js
          grep -q "ELI-001" /tmp/app.js
          grep -q "HAR-001" /tmp/app.js
          grep -q "CON-001" /tmp/app.js
