name: REALMS Platform Shell

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/realms-platform-shell.yml"
  workflow_dispatch:
  push:
    branches: [main, "platform/**"]
    paths:
      - "platform/**"
      - ".github/workflows/realms-platform-shell.yml"

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check platform/app.js
          node --check platform/game/eliteborn-catalogue.mjs
          node --check platform/game/formation-engine.mjs
          node --check platform/game/formation-lab.js
          node --check platform/config.js
          node --check platform/services/crashout-identity.mjs
      - name: Platform regression tests
        run: node --test platform/tests/*.test.cjs platform/tests/*.test.mjs
